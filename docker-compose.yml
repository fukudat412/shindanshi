# ローカル PostgreSQL（旧: Neon）
# 起動: npm run db:up   停止: docker compose down（データは volume に残る）
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shindanshi
      POSTGRES_PASSWORD: shindanshi
      POSTGRES_DB: shindanshi
    ports:
      # この Mac からだけ接続できるようにする（同じネットワークの他の端末には公開しない）
      - "127.0.0.1:54329:5432"
    volumes:
      # PostgreSQL 18 の公式イメージは /var/lib/postgresql/18/docker にデータを置くので、親ディレクトリを volume にする
      - shindanshi-pgdata:/var/lib/postgresql
volumes:
  shindanshi-pgdata:
